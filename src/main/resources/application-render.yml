# ============================================
# CONFIGURACIÓN DE PRODUCCIÓN PARA RENDER
# ============================================
# Este perfil se activa con SPRING_PROFILES_ACTIVE=render
# NOTA: La variable DATABASE_URL es procesada automáticamente
# por RenderDatabaseUrlProcessor que convierte postgres:// a jdbc:postgresql://
# ============================================

spring:
  config:
    activate:
      on-profile: render

  # ============================================
  # BASE DE DATOS - Render PostgreSQL
  # ============================================
  # La URL y credenciales son configuradas automáticamente
  # por RenderDatabaseUrlProcessor desde DATABASE_URL
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5  # Reducido para plan free
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ============================================
  # JPA/HIBERNATE
  # ============================================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20

  # ============================================
  # FLYWAY
  # ============================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    repair-on-migrate: true
    clean-disabled: true
    schemas: public

  # ============================================
  # MAIL (Opcional - Configurar en variables de entorno)
  # ============================================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ============================================
# SERVIDOR
# ============================================
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# ============================================
# SEGURIDAD JWT
# ============================================
app:
  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET:Mi_Super_Secreto_Para_JWT_Veterinaria_2024_Render_Production_Key}}
    expiration: 86400000  # 24 horas
    refresh-expiration: 604800000  # 7 días

  # CORS - URLs permitidas
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://veterinaria-frontend-kru7.onrender.com,https://veterinaria-frontend.onrender.com,http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

  # Archivos
  file:
    upload-dir: /tmp/uploads
    max-size: 10485760

# ============================================
# LOGGING
# ============================================
logging:
  level:
    root: WARN
    com.tuorg.veterinaria: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# ============================================
# ACTUATOR
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
