# ============================================
# DOCKER COMPOSE - CLÍNICA VETERINARIA HUMBOLDT
# ============================================
# Ejecutar: docker-compose up -d --build
# Detener: docker-compose down
# Ver logs: docker-compose logs -f
# ============================================

services:
  # ============================================
  # BASE DE DATOS POSTGRESQL
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: veterinaria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: veterinaria_db
      POSTGRES_USER: vet_admin
      POSTGRES_PASSWORD: Petrico123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Solo montar el script de inicialización principal (evita scripts que dependen de Flyway)
      - ./init-scripts/00-init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro
    ports:
      - "5433:5432"
    networks:
      - veterinaria-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet_admin -d veterinaria_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # BACKEND - SPRING BOOT
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: veterinaria-backend
    restart: unless-stopped
    environment:
      # Base de datos
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/veterinaria_db
      SPRING_DATASOURCE_USERNAME: vet_admin
      SPRING_DATASOURCE_PASSWORD: Petrico123
      # JPA
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      # Flyway
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      # JWT
      APP_JWT_SECRET: Mi_Super_Secreto_Para_JWT_Veterinaria_2024_Debe_Ser_Muy_Largo_Minimo_512_Bits_Docker
      APP_JWT_EXPIRATION: "86400000"
      # CORS - Permitir frontend
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80,http://frontend:80
      # Server
      SERVER_PORT: "8080"
      # Java opts
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8080:8080"
    networks:
      - veterinaria-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs

  # ============================================
  # FRONTEND - REACT + VITE + NGINX
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: veterinaria-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - veterinaria-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================
# REDES
# ============================================
networks:
  veterinaria-network:
    driver: bridge
    name: veterinaria-network

# ============================================
# VOLÚMENES PERSISTENTES
# ============================================
volumes:
  postgres_data:
    name: veterinaria-postgres-data
  backend_uploads:
    name: veterinaria-uploads
  backend_logs:
    name: veterinaria-logs
